[package]
name = "avalon-desktop"
version = "0.1.0"
description = "Avalon: task manager unifying projects, GitHub and a personal to-do"
edition = "2021"

[lib]
name = "avalon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
slug = "0.1"
